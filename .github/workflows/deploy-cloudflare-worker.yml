name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'apps/liff/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - 'packages/update-engine/**'
      - 'scripts/d1-run-migrations.mjs'
      - '.github/workflows/deploy-cloudflare-worker.yml'

jobs:
  preflight:
    if: github.repository != 'Shudesu/line-harness-oss'
    runs-on: ubuntu-latest
    env:
      LINE_HARNESS_CLOUDFLARE_DEPLOY: ${{ vars.LINE_HARNESS_CLOUDFLARE_DEPLOY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      WORKER_URL: ${{ secrets.WORKER_URL || secrets.NEXT_PUBLIC_API_URL }}
      ADMIN_ORIGIN: ${{ secrets.ADMIN_ORIGIN }}
      ADMIN_ALLOW_CROSS_SITE: ${{ secrets.ADMIN_ALLOW_CROSS_SITE }}
    steps:
      - name: Check deploy configuration
        run: |
          missing=0
          {
            echo "## Cloudflare Worker deploy preflight"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          check_required() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "- Missing: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          }

          if [ "$LINE_HARNESS_CLOUDFLARE_DEPLOY" != "true" ]; then
            echo "- Missing: \`LINE_HARNESS_CLOUDFLARE_DEPLOY=true\` repository variable" >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi
          check_required "CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_API_TOKEN"
          check_required "CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_ACCOUNT_ID"
          check_required "D1_DATABASE_NAME" "$D1_DATABASE_NAME"
          check_required "D1_DATABASE_ID" "$D1_DATABASE_ID"
          check_required "WORKER_URL" "$WORKER_URL"
          check_required "ADMIN_ORIGIN" "$ADMIN_ORIGIN"
          check_required "ADMIN_ALLOW_CROSS_SITE" "$ADMIN_ALLOW_CROSS_SITE"

          if [ "$missing" = "1" ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Deploy is skipped until the missing repository Actions settings are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All required Worker deploy settings are configured." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db --filter @line-harness/update-engine build

      - name: Run pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
        run: node scripts/d1-run-migrations.mjs

      - name: Build Worker and LIFF assets
        run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}

      - name: Patch wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'your-worker-name' }}
        run: |
          test -n "$D1_DATABASE_ID"
          cd apps/worker
          sed -i \
            -e "s|\"account_id\":\"[^\"]*\"|\"account_id\":\"${CLOUDFLARE_ACCOUNT_ID}\"|g" \
            -e "s|\"database_name\":\"[^\"]*\"|\"database_name\":\"${D1_DATABASE_NAME}\"|g" \
            -e "s|\"database_id\":\"[^\"]*\"|\"database_id\":\"${D1_DATABASE_ID}\"|g" \
            dist/line_harness/wrangler.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config dist/line_harness/wrangler.json --name ${{ vars.WORKER_NAME || 'your-worker-name' }}

      - name: Sync admin auth Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'your-worker-name' }}
          WORKER_URL: ${{ secrets.WORKER_URL || secrets.NEXT_PUBLIC_API_URL }}
          ADMIN_ORIGIN: ${{ secrets.ADMIN_ORIGIN }}
          ADMIN_ALLOW_CROSS_SITE: ${{ secrets.ADMIN_ALLOW_CROSS_SITE }}
        run: |
          test -n "$WORKER_URL"
          test -n "$ADMIN_ORIGIN"
          test -n "$ADMIN_ALLOW_CROSS_SITE"
          cd apps/worker
          printf '%s' "$WORKER_URL" | npx wrangler secret put WORKER_URL --name "$WORKER_NAME"
          printf '%s' "$ADMIN_ORIGIN" | npx wrangler secret put ADMIN_ORIGIN --name "$WORKER_NAME"
          printf '%s' "$ADMIN_ALLOW_CROSS_SITE" | npx wrangler secret put ADMIN_ALLOW_CROSS_SITE --name "$WORKER_NAME"
