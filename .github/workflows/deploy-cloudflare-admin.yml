name: Deploy Cloudflare Admin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/update-engine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-cloudflare-admin.yml'

jobs:
  preflight:
    if: github.repository != 'Shudesu/line-harness-oss'
    runs-on: ubuntu-latest
    env:
      LINE_HARNESS_CLOUDFLARE_DEPLOY: ${{ vars.LINE_HARNESS_CLOUDFLARE_DEPLOY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - name: Check deploy configuration
        run: |
          missing=0
          {
            echo "## Cloudflare Admin deploy preflight"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          check_required() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "- Missing: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          }

          if [ "$LINE_HARNESS_CLOUDFLARE_DEPLOY" != "true" ]; then
            echo "- Missing: \`LINE_HARNESS_CLOUDFLARE_DEPLOY=true\` repository variable" >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi
          check_required "CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_API_TOKEN"
          check_required "CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_ACCOUNT_ID"
          check_required "NEXT_PUBLIC_API_URL" "$NEXT_PUBLIC_API_URL"

          if [ "$missing" = "1" ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Deploy is skipped until the missing repository Actions settings are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All required Admin deploy settings are configured." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-harness/update-engine build

      - name: Capture build metadata
        id: build-meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build Admin Panel
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ADMIN_API_PROXY: 'true'
          NEXT_PUBLIC_UPDATE_BANNER_ENABLED: 'false'
          APP_BUILD_TIME: ${{ steps.build-meta.outputs.build_time }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME || 'your-admin-name' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NEXT_PUBLIC_API_URL"
          npx wrangler pages deploy apps/web/out \
            --project-name="$PAGES_PROJECT_NAME" \
            --commit-message="deploy ${GITHUB_SHA}"
